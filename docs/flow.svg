<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="工作原理">
  <rect width="1000" height="470" fill="#F8FAFC"/>

  <text x="60" y="34" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#0F172A">守护进程主循环</text>
  <text x="580" y="34" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#0F172A">配置从哪来</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="60" y="52" width="380" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="84" y="82" font-size="17" font-weight="500" fill="#0F172A">1. 读屏幕状态</text>
    <text x="84" y="102" font-size="13" fill="#64748B">背光节点优先，变黑时用 dumpsys power 复核</text>

    <rect x="60" y="146" width="380" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="84" y="176" font-size="17" font-weight="500" fill="#0F172A">2. 等触摸事件</text>
    <text x="84" y="196" font-size="13" fill="#64748B">epoll 监听 /dev/input，最多阻塞 2 秒</text>

    <rect x="60" y="240" width="380" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="84" y="270" font-size="17" font-weight="500" fill="#0F172A">3. 取前台包名</text>
    <text x="84" y="290" font-size="13" fill="#64748B">dumpsys 多命令回退，结果缓存 5 秒</text>

    <rect x="60" y="334" width="380" height="64" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="84" y="364" font-size="17" font-weight="500" fill="#1E3A8A">4. 超时则息屏</text>
    <text x="84" y="384" font-size="13" fill="#3B82F6">KEYCODE_SLEEP 223 → 26 兜底 → 回读校验</text>

    <path d="M250 116 V142" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M250 210 V236" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M250 304 V330" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a)"/>

    <path d="M60 366 H34 V84 H56" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ag)"/>
    <text x="18" y="230" font-size="12" fill="#94A3B8" transform="rotate(-90 18 230)">每轮约 2 秒</text>

    <rect x="580" y="52" width="360" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="604" y="82" font-size="17" font-weight="500" fill="#0F172A">WebUI</text>
    <text x="604" y="102" font-size="13" fill="#64748B">KernelSU / APatch 管理器内打开，无需装 App</text>

    <rect x="580" y="146" width="360" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="604" y="176" font-size="17" font-weight="500" fill="#0F172A">配置.prop</text>
    <text x="604" y="196" font-size="13" fill="#64748B">package= + limit_time=，也可手动编辑</text>

    <rect x="580" y="240" width="360" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="604" y="270" font-size="17" font-weight="500" fill="#0F172A">每 10 秒检查一次改动</text>
    <text x="604" y="290" font-size="13" fill="#64748B">mtime / size 变了就热重载，不用重启</text>

    <path d="M760 116 V142" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M760 210 V236" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#a)"/>

    <path d="M940 272 H966 V60" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="640" y="340" font-size="13" fill="#64748B">保存后 10 秒内生效，守护进程不需要重启</text>
  </g>
</svg>
