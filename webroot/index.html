<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>安眠[息屏管理]</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7280;
    --line: #e6e8ec;
    --accent: #2563eb;
    --accent-soft: #eaf0ff;
    --danger: #dc2626;
    --ok: #15803d;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e9ecf1;
      --muted: #98a0ad;
      --line: #262b35;
      --accent: #6d9bff;
      --accent-soft: #1a2540;
      --danger: #f87171;
      --ok: #4ade80;
      --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    padding-bottom: 92px;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 16px 16px 8px;
  }
  h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  main { padding: 8px 16px 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .badge.off { background: rgba(220,38,38,.12); color: var(--danger); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .muted { color: var(--muted); font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  .app {
    border-top: 1px solid var(--line);
    padding: 12px 0;
  }
  .app:first-of-type { border-top: none; padding-top: 4px; }
  .app-head { display: flex; align-items: center; gap: 10px; }
  .app-info { flex: 1 1 auto; min-width: 0; }
  .app-name {
    font-weight: 600; font-size: 15px; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .app-pkg {
    color: var(--muted); font-size: 11.5px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .app-ops { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
  .pin, .del {
    border: none; background: transparent; font-size: 12.5px;
    padding: 5px 7px; cursor: pointer; border-radius: 8px;
  }
  .pin { color: var(--muted); }
  .pin:active { background: rgba(127,127,127,.12); }
  .del { color: var(--danger); }
  .del:active { background: rgba(220,38,38,.1); }

  .stepper { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .step-label { font-size: 12px; color: var(--muted); margin-right: auto; }
  .step {
    width: 34px; height: 32px; border-radius: 9px; flex: 0 0 34px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-size: 16px; line-height: 1;
  }
  .step:active { background: var(--accent-soft); color: var(--accent); }
  .unit { color: var(--muted); font-size: 12.5px; }
  .time-input {
    width: 56px; text-align: center; padding: 6px 8px; font-size: 14.5px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .time-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .empty { text-align: center; color: var(--muted); padding: 22px 0; font-size: 13.5px; }
  .btn {
    width: 100%; border: none; border-radius: 12px; padding: 13px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { padding: 10px; font-size: 13.5px; flex: 1 1 0; min-width: 0; }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--line);
  }
  .dock .btn { max-width: 720px; margin: 0 auto; display: block; }

  pre.log.collapsed { max-height: 0; padding: 0; margin: 0; border: 0; opacity: 0; }
  pre.log {
    margin: 8px 0 0; padding: 10px; border-radius: 10px;
    background: var(--bg); color: var(--muted);
    font-size: 11.5px; line-height: 1.5; max-height: 190px; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  .search {
    width: 100%; padding: 11px 12px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-size: 15px;
  }
  .manual { display: flex; gap: 8px; margin: 8px 0 10px; }
  .manual input { flex: 1 1 auto; min-width: 0; }
  .manual .btn { width: auto; flex: 0 0 auto; padding: 0 18px; font-size: 14px; }
  .verdict {
    margin-top: 8px; padding: 9px 11px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
  }
  .verdict.ok { background: rgba(21,128,61,.12); color: var(--ok); }
  .verdict.warn { background: rgba(180,83,9,.12); color: var(--warn); }
  .verdict.bad { background: rgba(220,38,38,.10); color: var(--danger); }
  .pick {
    margin-top: 10px; padding: 12px; border-radius: 12px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .pick-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .pick-title { font-size: 13.5px; font-weight: 500; }
  .pick-count { margin-left: 8px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .picklist { max-height: 50vh; overflow: auto; margin-top: 4px; -webkit-overflow-scrolling: touch; }
  .pickrow { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: 10px; }
  .pickrow:active { background: var(--accent-soft); }
  .avatar {
    flex: 0 0 34px; width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent);
  }
  .avatar.unknown { background: rgba(128,128,128,.14); color: var(--muted); }
  .avatar { position: relative; overflow: hidden; }
  .avatar img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .pinfo { flex: 1 1 auto; min-width: 0; }
  .pnm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ppk { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pickact {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
    color: var(--accent); border-radius: 999px; padding: 5px 13px; font-size: 12.5px;
  }
  .pickact.done { color: var(--muted); border-style: dashed; background: transparent; }
  .pickmore {
    width: 100%; margin: 6px 0 2px; padding: 10px 0;
    border: none; background: transparent; color: var(--accent); font-size: 13px;
  }
  .pick { position: relative; }
  .picklist { padding-right: 24px; }
  .pickrail {
    position: absolute; right: 2px; top: 104px; bottom: 8px;
    display: flex; flex-direction: column; justify-content: center;
    width: 20px;
  }
  .railbtn {
    border: none; background: transparent; color: var(--muted);
    font-size: 9.5px; line-height: 1; padding: 2px 0; border-radius: 4px;
  }
  .railbtn.on { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
  .pickgroup {
    margin: 8px 0 2px; padding-top: 4px;
    font-size: 11px; color: var(--muted); letter-spacing: .6px;
  }
  .picksep {
    margin: 10px 0 2px; padding-top: 8px; border-top: 1px dashed var(--line);
    font-size: 12px; color: var(--muted); letter-spacing: .3px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px);
    background: rgba(20,22,28,.92); color: #fff;
    padding: 9px 16px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .18s; z-index: 80;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .notice {
    background: rgba(180,83,9,.12); color: var(--warn);
    border-radius: 12px; padding: 12px; font-size: 13px; margin-bottom: 12px;
  }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="row">
    <div>
      <h1>安眠[息屏管理]</h1>
      <div class="sub" id="subTitle">配置应用与使用时限</div>
    </div>
    <span class="badge" id="statusBadge"><span class="dot"></span><span id="statusText">检测中</span></span>
  </div>
</header>

<main>
  <div id="notice" class="notice" hidden></div>

  <section class="card" id="listCard">
    <div class="row">
      <div class="app-name">已配置应用</div>
      <span class="badge" id="countBadge">0 个</span>
    </div>
    <div class="hint" id="srcInfo">读取中…</div>
    <div id="list"></div>
    <div class="manual">
      <input class="search" id="pkgInput" placeholder="输入包名，自动识别名称">
      <button class="btn ghost" id="pkgAdd">添加</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn ghost" id="pickBtn">选择应用</button>
      <button class="btn ghost" id="importBtn">导入备份</button>
      <button class="btn ghost" id="exportCfgBtn">导出备份</button>
    </div>
    <div class="hint">换机备份：导出到 Download/配置.prop，新机再「导入备份」。</div>
    <div class="pick" id="picker" hidden>
      <div class="pick-head">
        <span class="pick-title">已安装应用<span class="pick-count" id="pickCount"></span></span>
        <button class="del" id="pickReload" style="color:var(--accent)">重新读取</button>
      </div>
      <input class="search" id="pickSearch" placeholder="搜索应用名或包名">
      <div class="hint" id="pickHint" style="margin-top:6px">正在读取…</div>
      <div class="picklist" id="pickList"></div>
      <div class="pickrail" id="pickRail"></div>
    </div>
    <div class="hint">无触摸达到设定时间即息屏，触摸后重新计时。</div>
  </section>

  <section class="card">
    <div class="row">
      <div class="app-name">运行状态</div>
      <div style="display:flex;gap:4px">
        <button class="del" id="logToggle" style="color:var(--accent)">展开日志</button>
        <button class="del" id="refreshBtn" style="color:var(--accent)">刷新</button>
      </div>
    </div>
    <div class="muted mono" id="procInfo">—</div>
    <div class="verdict" id="verdict" hidden></div>
    <pre class="log collapsed" id="logBox">读取中…</pre>
    <div class="btn-row">
      <button class="btn ghost" id="restartBtn">重启</button>
      <button class="btn ghost" id="stopBtn">停止</button>
      <button class="btn ghost" id="diagBtn">诊断</button>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="testOffBtn">测试息屏</button>
    </div>
    <div class="hint">需要生成详细环境诊断报告时，请安装「诊断版」安装包（功能相同，额外带诊断报告）。</div>
  </section>

  <div class="hint" style="text-align:center;padding:4px 0 12px">
    修改后点底部保存，10 秒内自动生效，无需重启
  </div>
</main>

<div class="dock">
  <button class="btn" id="saveBtn">保存配置</button>
</div>

<div id="toast"></div>

  var entries = [];
  var dirty = false;
  var nameMap = {};
  var pkgName = {};
  var nameScanning = false;
  var scanTried = false;
  var iconIndex = {};
  var iconCache = {};
  var iconQueue = [];
  var iconTimer = null;
  var iconIndexLoaded = false;
  var nativeIconOk = 0;
  var nativeIconOkCount = 0;
  var nativeIconFail = 0;
  var srcLabel = '';

  function $(id) { return document.getElementById(id); }

  function hasKsu() {
    return typeof ksu !== 'undefined' && ksu && typeof ksu.exec === 'function';
  }

  // 注意：KernelSU 的 ksu.exec(cmd) 底层是 libsu 的 ShellUtils.fastCmd，
  // 它只返回 stdout 的【最后一行】，命令没有任何输出时返回空串（失败也看不出来）。
  // 所以这里不能用它直接读多行文件：统一把整段输出 base64 压成一行，
  // 行首放退出码，末尾一条命令负责收尾，这样字符串返回值和 {errno,stdout,stderr} 两种实现都能正确解析。
  function sh(cmd) {
    if (!hasKsu()) return { errno: -1, stdout: '', stderr: 'No WebUI API' };

    var script =
      '{\n' + cmd + '\n} >' + TMPOUT + ' 2>&1; rc=$?; ' +
      'echo -n "$rc "; ' +
      "{ base64 " + TMPOUT + " 2>/dev/null || toybox base64 " + TMPOUT + " 2>/dev/null; } | tr -d '\\n'; " +
      'echo; rm -f ' + TMPOUT;

    var r;
    try {
      r = ksu.exec(script);
    } catch (e) {
      return { errno: -1, stdout: '', stderr: String(e) };
    }

    if (r && typeof r.then === 'function') return { errno: -1, stdout: '', stderr: 'async' };

    var raw;
    if (typeof r === 'string') raw = r;
    else if (r && typeof r === 'object') raw = String(r.stdout || '') + (r.stderr ? '\n' + r.stderr : '');
    else raw = '';

    var lines = String(raw).replace(/\r/g, '').split('\n');
    var line = '';
    for (var i = lines.length - 1; i >= 0; i--) {
      if (lines[i].replace(/\s+$/, '')) { line = lines[i].replace(/\s+$/, ''); break; }
    }
    if (!line) return { errno: -1, stdout: '', stderr: 'WebUI 没有返回任何结果' };

    var sp = line.indexOf(' ');
    var rc = parseInt(sp < 0 ? line : line.slice(0, sp), 10);
    var text = sp < 0 ? '' : b64d(line.slice(sp + 1));
    return { errno: isNaN(rc) ? -1 : rc, stdout: text, stderr: text };
  }

  function b64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function b64d(s) {
    try {
      var bin = atob(s);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    } catch (e) {
      return '';
    }
  }

  function toOctalEscaped(str) {
    var bytes = new TextEncoder().encode(str);
    var out = '';
    for (var i = 0; i < bytes.length; i++) {
      out += '\\' + ('00' + bytes[i].toString(8)).slice(-3);
    }
    return out;
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function notice(msg) {
    var n = $('notice');
    n.textContent = msg;
    n.hidden = !msg;
  }

  function displayName(e) {
    return e.name || pkgName[e.pkg] || PRESETS[e.pkg] || e.pkg;
  }

  // 配置文件里 package 上一行的注释存的是应用名；文件头那几行说明性注释不能当名字。
  function isNameComment(text) {
    if (!text || text.length > 40) return false;
    return !/^(应用包名|package|limit_time|由 WebUI 生成|说明)/i.test(text);
  }

  function parseConfig(text) {
    var out = [];
    var cur = null;
    var pending = '';
    text.split('\n').forEach(function (raw) {
      var line = raw.replace(/\r$/, '').trim();
      if (!line) return;
      if (line.charAt(0) === '#') {
        var c = line.replace(/^#+\s*/, '');
        pending = isNameComment(c) ? c : '';
        return;
      }
      var i = line.indexOf('=');
      if (i < 0) return;
      var k = line.slice(0, i).trim();
      var v = line.slice(i + 1).trim();
      if (k === 'package') {
        if (!v) return;
        var nm = pending && pending !== v ? pending : '';
        cur = { pkg: v, limit: '30m', name: nm || PRESETS[v] || '' };
        out.push(cur);
        pending = '';
      } else if (k === 'limit_time' && cur) {
        cur.limit = v;
      }
    });
    return out;
  }

  function serialize(list) {
    var lines = [
      '# 应用包名与限制时间（由 WebUI 生成）',
      '# limit_time 支持 数字(s|m|h)，不写单位按分钟算，整项不写默认 30 分钟',
      ''
    ];
    list.forEach(function (e) {
      lines.push('# ' + displayName(e));
      lines.push('package=' + e.pkg);
      lines.push('limit_time=' + parseLimitMinutes(e.limit) + 'm');
      lines.push('');
    });
    return lines.join('\n');
  }

  function readConfigSource() {
    var list = [
      { path: CONFIG, label: '模块配置' },
      { path: UPDATE_CONFIG, label: '待生效配置' },
      { path: BACKUP, label: '上次备份' }
    ];
    for (var i = 0; i < list.length; i++) {
      var r = sh("cat '" + list[i].path + "' 2>/dev/null");
      if (r.errno === 0 && (r.stdout || '').trim()) {
        return { label: list[i].label, path: list[i].path, text: r.stdout };
      }
    }
    return null;
  }

  function setSrcInfo(text) {
    $('srcInfo').textContent = text;
  }

  function updateSrc() {
    $('countBadge').textContent = entries.length + ' 个';
    $('saveBtn').textContent = dirty ? '保存配置（有未保存修改）' : '保存配置';
    if (!srcLabel) {
      setSrcInfo('没有找到配置文件，添加应用后保存即可生成');
      return;
    }
    setSrcInfo('来源：' + srcLabel + (dirty ? ' · 未保存' : ''));
  }

  function load() {
    if (!hasKsu()) {
      notice('当前环境没有 WebUI 执行权限。请用 KernelSU / APatch 的管理器打开本页面，或安装 WebUI X 后从 Magisk 进入。');
      $('saveBtn').disabled = true;
      setSrcInfo('无法读取配置');
      return;
    }

    // 管理器没有原生接口时，别再去试 ksu://icon，直接用缓存或现场解包
    if (!nativePm()) nativeIconOk = -1;

    var dis = sh("test -f '" + MOD + "/disable' && echo 1");
    if ((dis.stdout || '').trim() === '1') notice('模块当前处于禁用状态，配置仍可修改，启用后生效。');

    var found = readConfigSource();
    if (!found) {
      entries = [];
      srcLabel = '';
    } else {
      entries = parseConfig(found.text);
      srcLabel = found.label;
      if (!entries.length) {
        notice('配置文件读到了（' + found.path + '）但解析不出任何应用，可能是文件格式损坏，添加应用后保存会重新写入。');
      } else if (found.path !== CONFIG) {
        notice('当前显示的是「' + found.label + '」，保存后会写入模块配置。');
      }
    }

    render();
    refreshStatus();
    setTimeout(function () {
      primeEntryNames();
      prefetchEntryIcons();
    }, 30);
  }

  function importDownload() {
    var r = sh("cat '" + IMPORT_PATH + "' 2>/dev/null");
    if (r.errno !== 0 || !(r.stdout || '').trim()) {
      toast('没找到 ' + IMPORT_PATH);
      return;
    }
    var list = parseConfig(r.stdout);
    if (!list.length) {
      toast('文件里没有可识别的 package/limit_time');
      return;
    }
    entries = list;
    srcLabel = 'Download 导入';
    dirty = true;
    render();
    toast('已导入 ' + entries.length + ' 个应用');

  function exportBackup() {
    if (!hasKsu()) return;
    if (!entries.length) {
      toast('列表是空的，先添加应用再导出');
      return;
    }
    var content = serialize(entries);
    sh("mkdir -p '/sdcard/Download'");
    var w = sh("printf '%s' '" + b64(content) + "' | base64 -d > '" + IMPORT_PATH + ".tmp' && mv -f '" + IMPORT_PATH + ".tmp' '" + IMPORT_PATH + "'");
    if (w.errno !== 0) {
      w = sh("printf '%b' '" + toOctalEscaped(content) + "' > '" + IMPORT_PATH + ".tmp' && mv -f '" + IMPORT_PATH + ".tmp' '" + IMPORT_PATH + "'");
    }
    if (w.errno !== 0) {
      notice('导出失败（退出码 ' + w.errno + '）：' + ((w.stdout || '').trim() || '未知错误'));
      toast('导出失败，看上方提示');
      return;
    }
    toast('已导出到 Download/配置.prop，共 ' + entries.length + ' 个应用');

  function render() {
    var box = $('list');

    updateSrc();

    if (!entries.length) {
      var d = document.createElement('div');

    entries.forEach(function (e, idx) {
      var wrap = document.createElement('div');

        }

        setTimeout(function () {
          if (del.isConnected && del.dataset.armed === '1') {
            del.dataset.armed = '0';
            del.textContent = '删除';
          }
        }, 2500);
      };

      var ops = document.createElement('div');
      ops.className = 'app-ops';
      if (idx > 0) {
        var top = document.createElement('button');
        top.className = 'pin';
        top.textContent = '置顶';
        top.onclick = function () {
          var item = entries.splice(idx, 1)[0];
          entries.unshift(item);
          dirty = true;
          render();
          toast('已置顶 ' + displayName(item));
        };
        ops.appendChild(top);
      }
      ops.appendChild(del);

      head.appendChild(info);
      head.appendChild(ops);

      var minutes = parseLimitMinutes(e.limit);
      e.limit = minutes + 'm';

      var tr = document.createElement('div');
      tr.className = 'stepper';

      var lb = document.createElement('span');
      lb.className = 'step-label';
      lb.textContent = '限制';
      tr.appendChild(lb);

      var minus = document.createElement('button');
      minus.className = 'step';
      minus.textContent = '－';

      var input = document.createElement('input');
      input.className = 'time-input';
      input.type = 'text';
      input.inputMode = 'numeric';
      input.value = String(minutes);

      var unit = document.createElement('span');
      unit.className = 'unit';
      unit.textContent = '分钟';

      var plus = document.createElement('button');
      plus.className = 'step';
      plus.textContent = '＋';

      function apply(n, fromInput) {
        n = Math.min(180, Math.max(1, Math.round(n) || 1));
        e.limit = n + 'm';
        dirty = true;
        if (!fromInput) input.value = String(n);
        updateSrc();
      }

      minus.onclick = function () { apply(parseLimitMinutes(e.limit) - 5); };
      plus.onclick = function () { apply(parseLimitMinutes(e.limit) + 5); };
      input.onchange = function () { apply(parseLimitMinutes(input.value)); input.value = String(parseLimitMinutes(e.limit)); };

      tr.appendChild(minus);
      tr.appendChild(input);
      tr.appendChild(unit);
      tr.appendChild(plus);

      wrap.appendChild(head);
      wrap.appendChild(tr);
      box.appendChild(wrap);
    });
  }

  function parseLimitMinutes(v) {
    var m = /^(\d+)\s*([smh]?)$/i.exec(String(v || '').trim());
    if (!m) return 30;
    var n = parseInt(m[1], 10);
    var u = (m[2] || 'm').toLowerCase();
    if (u === 'h') n *= 60;
    else if (u === 's') n = Math.round(n / 60);
    if (!n) n = 1;
    return Math.min(180, Math.max(1, n));
  }

  function hasBinary() {
    var r = sh("test -f '" + MOD + "/App_screen_off' && echo ok");
    return (r.stdout || '').trim() === 'ok';
  }

  function refreshStatus() {
    if (!hasKsu()) return;

    if (!hasBinary()) {
      $('statusBadge').classList.add('off');
      $('statusText').textContent = '不完整';
      $('procInfo').textContent = '缺少 App_screen_off：模块没装完整，请重新刷入本模块（或手动把 bin/<架构>/App_screen_off 复制到模块根目录）';
      $('logBox').textContent = '暂无日志';
      return;
    }

    var p = sh("pidof App_screen_off 2>/dev/null || ps -A 2>/dev/null | grep '[A]pp_screen_off' | awk '{print $2}'");
    var pids = (p.stdout || '').trim().split(/\s+/).filter(function (x) { return !!x; });
    var badge = $('statusBadge');
    if (pids.length) {
      badge.classList.remove('off');
      $('statusText').textContent = '运行中';
      var extra = '';
      if (pids.length === 2) extra = ' · 扫描进行中';
      else if (pids.length > 2) extra = ' · 检测到 ' + pids.length + ' 个进程，可点「重启」清理';
      $('procInfo').textContent = 'PID ' + pids.join(' ') + ' · 配置每 10 秒检查一次' + extra;
    } else {
      badge.classList.add('off');
      $('statusText').textContent = '未运行';
      $('procInfo').textContent = '守护进程没有在跑，模块可能被禁用或启动失败';
    }

    var lg = sh("tail -n 12 '" + LOG + "' 2>/dev/null");
    var box = $('logBox');
    box.textContent = (lg.stdout || '').trim() || '暂无日志';
    box.scrollTop = 0;
  }

  function setVerdict(text, level) {
    var v = $('verdict');
    if (!text) {
      v.hidden = true;
      return;
    }
    v.hidden = false;
    v.textContent = text;
    v.className = 'verdict ' + (level || 'warn');
  }

  function testOff() {
    if (!hasBinary()) {
      toast('缺少 App_screen_off，先重新刷入模块');
      return;
    }
    toast('测试中，最多 10 秒…');
    setTimeout(function () {
      var r = sh("'" + MOD + "/App_screen_off' --test-off 2>&1");
      var out = (r.stdout || '').trim();
      var box = $('logBox');
      box.textContent = out || ('测试没有输出：' + (r.stderr || '未知错误'));
      setLogCollapsed(false);
      requestAnimationFrame(function () { box.scrollTop = 0; });
      if (out.indexOf('息屏成功') >= 0) {
        setVerdict('息屏按键：可用（已实测）', 'ok');
      } else if (out) {
        setVerdict('息屏按键：失败或被系统拦截', 'bad');
      }
      toast(out.indexOf('息屏成功') >= 0 ? '息屏成功' : '没成功，看上面的输出');
      setTimeout(refreshStatus, 1500);
    }, 60);
  }

  function setLogCollapsed(on) {
    $('logBox').classList.toggle('collapsed', !!on);
    $('logToggle').textContent = on ? '展开日志' : '收起日志';
  }

  function runDiag() {
    if (!hasBinary()) {
      toast('找不到 App_screen_off，先重新刷入模块');
      return;
    }
    toast('诊断中，约 5 秒…');
    var tmp = '/data/local/tmp/aso_diag.txt';
    setTimeout(function () {
      sh("'" + MOD + "/App_screen_off' --diag --config='" + CONFIG + "' > " + tmp + " 2>&1");
      var line = (sh("grep -m1 '诊断结论' " + tmp + " 2>/dev/null").stdout || '').trim();
      var m = /诊断结论:\s*(\S+)/.exec(line);
      if (m) {
        var level = m[1] === '可用' ? 'ok' : (m[1] === '疑似可用' ? 'warn' : 'bad');
        setVerdict('诊断结论：' + m[1], level);
        toast('诊断完成：' + m[1]);
      } else {
        setVerdict('诊断没有输出，请重试；仍失败可用「诊断版」排查', 'bad');
        toast('诊断没有输出');
      }
    }, 60);
  }

  function addEntry(pkg) {
    if (entries.some(function (e) { return e.pkg === pkg; })) {
      toast('这个包名已经在列表里了');
      return false;
    }

    var entry = { pkg: pkg, limit: '30m', name: PRESETS[pkg] || nameMap[pkg] || '' };
    entries.push(entry);
    dirty = true;
    render();

    if (entry.name) {
      toast('已添加 ' + entry.name + '，记得保存');
    } else {
      toast('已添加，正在识别应用名称…');
      setTimeout(function () { resolveLabel(entry); }, 60);
    }
    return true;
  }

  function manualAdd() {
    var el = $('pkgInput');
    var pkg = (el.value || '').trim().replace(/\s+/g, '');
    if (!/^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)+$/.test(pkg)) {
      toast('包名格式不对，例如 com.ss.android.ugc.aweme');
      return;
    }
    if (addEntry(pkg)) el.value = '';
  }

  // 字典里没有的包名，添加时再问一次设备：先确认装了没有，再看能不能读到应用名。
  // 系统自带的 pm / dumpsys 都不直接给应用名，只有少数机器带 aapt/aapt2，
  // 能读到就补上，读不到就保持显示包名，不影响使用。
  function resolveLabel(entry) {
    var p = sh("pm path '" + entry.pkg + "' 2>/dev/null");
    var apk = '';
    (p.stdout || '').split('\n').forEach(function (l) {
      var t = l.trim();
      if (!apk && t.indexOf('package:') === 0) apk = t.slice(8).trim();
    });
    if (!apk) {
      toast('已添加 ' + entry.pkg + '；设备上没装这个应用，识别不了名称');
      return;
    }

    var tool = '';
    var t = sh("command -v aapt2 2>/dev/null || command -v aapt 2>/dev/null");
    (t.stdout || '').split('\n').forEach(function (l) {
      var v = l.trim();
      if (!tool && v) tool = v;
    });

    if (tool) {
      var out = (sh("'" + tool + "' d badging '" + apk + "' 2>/dev/null | grep -a 'application-label'").stdout || '');
      var m = /application-label-zh[^:]*:\s*'([^']*)'/.exec(out) || /application-label:\s*'([^']*)'/.exec(out);
      if (m && m[1] && m[1] !== 'null') {
        entry.name = m[1];
        render();
        toast('已识别为「' + entry.name + '」，记得保存');
        return;
      }
    }

    var d = (sh("dumpsys package '" + entry.pkg + "' 2>/dev/null | grep -m1 'nonLocalizedLabel='").stdout || '');
    var m2 = /nonLocalizedLabel=([^\s}]+)/.exec(d);
    if (m2 && m2[1] && m2[1] !== 'null') {
      entry.name = m2[1];
      render();
      toast('已识别为「' + entry.name + '」，记得保存');
      return;
    }

    toast('已添加 ' + entry.pkg + '；系统没提供这个应用的名称，显示包名');
  }

  var installedList = null;
  var pickerOpen = false;
  var pickLetter = '';
  var COLLATOR = null;
  try { COLLATOR = new Intl.Collator('zh-Hans-CN'); } catch (e) { COLLATOR = null; }
  // 拼音首字母的边界字：用中文排序比较，落在哪两个边界之间就是哪个字母
  var PICK_LETTERS = [['A','阿'],['B','八'],['C','擦'],['D','搭'],['E','蛾'],['F','发'],['G','噶'],['H','哈'],
                      ['J','击'],['K','喀'],['L','拉'],['M','妈'],['N','拿'],['O','哦'],['P','啪'],['Q','七'],
                      ['R','然'],['S','撒'],['T','塌'],['W','挖'],['X','西'],['Y','压'],['Z','匝']];
  var iconSrc = {};
  var iconAsked = {};
  var iconDead = {};
  var entryIconTried = {};
  var entryNameTried = {};

  function validPkgName(s) {
    return /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)+$/.test(s);
  }

  // KernelSU / APatch 新版的 WebUI 接口：直接给包名、应用名，图标走 ksu://icon/<包名>
  function nativePm() {
    try {
      if (typeof ksu === 'undefined' || !ksu) return null;
      if (typeof ksu.pm === 'function') {
        var p = ksu.pm();
        if (p && typeof p.getPackagesInfo === 'function') return p;
      }
    } catch (e) { /* 老版本没有这个接口 */ }
    return null;
  }

  function nativeList() {
    var p = nativePm();
    if (!p || typeof p.listPackages !== 'function') return null;
    try {
      var arr = JSON.parse(p.listPackages('all'));
      return Array.isArray(arr) && arr.length ? arr : null;
    } catch (e) { return null; }
  }

  function nativeLabels(pkgs) {
    if (!pkgs.length) return null;
    var p = nativePm();
    var raw = null;
    try {
      if (p) raw = p.getPackagesInfo(JSON.stringify(pkgs));
      else if (typeof ksu !== 'undefined' && typeof ksu.getPackagesInfo === 'function') {
        raw = ksu.getPackagesInfo(JSON.stringify(pkgs));
      }
    } catch (e) { return null; }
    if (!raw) return null;
    try {
      var arr = JSON.parse(raw);
      var map = {};
      (arr || []).forEach(function (it) {
        if (it && it.packageName && it.appLabel) map[it.packageName] = it.appLabel;
      });
      return Object.keys(map).length ? map : null;
    } catch (e) { return null; }
  }

  function nativeIconSrc(pkg) {
    return nativeIconOk < 0 ? '' : ('ksu://icon/' + pkg);
  }

  // 列出全部应用：各家 ROM 对 pm 参数支持不一，逐条回退，拿到就停
  var PKG_LIST_CMDS = [
    "pm list packages 2>/dev/null | head -n 600",
    "/system/bin/pm list packages 2>/dev/null | head -n 600",
    "cmd package list packages 2>/dev/null | head -n 600",
    "pm list packages -f 2>/dev/null | sed 's/^package://; s/.*=//' | head -n 600",
    "dumpsys package 2>/dev/null | awk '/Package \\[/{print $2}' | tr -d '[]' | head -n 600",
    "cat /data/system/packages.list 2>/dev/null | awk '{print $1}' | head -n 600"
  ];

  var PKG_NOISE = ['com.android.providers.', 'com.android.internal.', 'com.android.permission'];

  function isNoisePkg(pkg) {
    if (pkg === 'android') return true;
    if (pkg.indexOf('.overlay') >= 0) return true;
    for (var i = 0; i < PKG_NOISE.length; i++) {
      if (pkg.indexOf(PKG_NOISE[i]) === 0) return true;
    }
    return false;
  }

  function parsePkgList(text) {
    var out = [];
    var seen = {};
    (text || '').split('\n').forEach(function (raw) {
      var t = raw.replace(/\r$/, '').trim();
      if (!t) return;
      t = t.replace(/^package:/, '');
      if (t.indexOf('=') >= 0) t = t.slice(t.lastIndexOf('=') + 1);
      t = t.replace(/^\[/, '').replace(/\]$/, '');
      var sp = t.indexOf(' ');
      if (sp > 0) t = t.slice(0, sp);
      if (!validPkgName(t) || seen[t] || isNoisePkg(t)) return;
      seen[t] = 1;
      out.push({ pkg: t, name: '' });
    });
    return out;
  }

  function loadInstalled(force) {
    if (installedList && !force) return installedList;
    installedList = null;

    var saved = {};
    entries.forEach(function (e) { if (e.name) saved[e.pkg] = e.name; });

    var list = null;
    var nat = nativeList();
    if (nat) {
      list = [];
      nat.forEach(function (pkg) {
        if (!validPkgName(pkg) || isNoisePkg(pkg)) return;
        list.push({ pkg: pkg, name: '' });
      });
    }

    for (var i = 0; !list && i < PKG_LIST_CMDS.length; i++) {
      var parsed = parsePkgList(sh(PKG_LIST_CMDS[i]).stdout);
      if (parsed.length) list = parsed;
    }
    if (!list || !list.length) {
      installedList = [];

  function pinyinInitial(ch) {
    var i = ch.charCodeAt(0) - PY_BASE;
    if (i < 0 || i >= PY_TABLE.length) return '';
    var c = PY_TABLE.charAt(i);
    return (c >= 'a' && c <= 'z') ? c.toUpperCase() : '';
  }

  function initialOf(name) {
    var s = (name || '').trim();
    if (!s) return '#';
    var ch = s.charAt(0);
    var up = ch.toUpperCase();
    if (up >= 'A' && up <= 'Z') return up;
    if (up >= '0' && up <= '9') return '#';
    var py = pinyinInitial(ch);
    if (py) return py;
    if (!COLLATOR) return '#';
    var res = '#';
    for (var i = 0; i < PICK_LETTERS.length; i++) {
      if (COLLATOR.compare(s, PICK_LETTERS[i][1]) >= 0) res = PICK_LETTERS[i][0];
      else break;
    }
    return res;
  }

  function buildRail() {
    var rail = $('pickRail');
    if (!rail) return;
    rail.innerHTML = '';

    var present = {};
    installedList.forEach(function (it) { present[initialOf(it.name || it.pkg)] = 1; });

    var all = document.createElement('button');
    all.className = 'railbtn' + (pickLetter ? '' : ' on');
    all.textContent = '全';
    all.onclick = function () {
      pickLetter = '';
      $('pickSearch').value = '';
      renderPicker();
    };
    rail.appendChild(all);

    var letters = [];
    for (var i = 0; i < PICK_LETTERS.length; i++) {
      if (present[PICK_LETTERS[i][0]]) letters.push(PICK_LETTERS[i][0]);
    }
    if (present['#']) letters.unshift('#');

    letters.forEach(function (L) {
      var b = document.createElement('button');
      b.className = 'railbtn' + (pickLetter === L ? ' on' : '');
      b.textContent = L;
      b.onclick = function () {
        pickLetter = (pickLetter === L) ? '' : L;
        $('pickSearch').value = '';
        renderPicker();
      };
      rail.appendChild(b);
    });
  }

  function renderPicker() {
    if (!installedList) return;

    var box = $('pickList');
    box.innerHTML = '';
    setPickCount(installedList.length);

    var kw = ($('pickSearch').value || '').trim().toLowerCase();
    var addedMap = {};
    entries.forEach(function (e) { addedMap[e.pkg] = 1; });

    var items = installedList.filter(function (it) {
      if (!kw) return true;
      return ((it.name || '') + ' ' + it.pkg).toLowerCase().indexOf(kw) >= 0;
    });

    if (!kw && pickLetter) {
      items = items.filter(function (it) { return initialOf(it.name || it.pkg) === pickLetter; });
    }

    items.sort(function (a, b) {
      if (!a.name !== !b.name) return a.name ? -1 : 1;
      return (a.name || a.pkg).localeCompare(b.name || b.pkg, 'zh-Hans-CN');
    });

    if (kw) {
      for (var i = 0; i < items.length; i++) box.appendChild(pickRow(items[i], addedMap));
    } else {
      var last = '';
      items.forEach(function (it) {
        var L = initialOf(it.name || it.pkg);
        if (L !== last) {
          last = L;
          var head = document.createElement('div');
          head.className = 'pickgroup';
          head.textContent = L;
          box.appendChild(head);
        }
        box.appendChild(pickRow(it, addedMap));
      });
    }

    buildRail();

    if (!items.length) {
      $('pickHint').textContent = kw ? '没有匹配的应用，换个关键字试试'
        : (pickLetter ? ('「' + pickLetter + '」开头没有应用') : '没有应用');
    } else if (kw) {
      $('pickHint').textContent = '匹配 ' + items.length + ' 个应用';
    } else if (pickLetter) {
      $('pickHint').textContent = '「' + pickLetter + '」开头 · ' + items.length + ' 个应用';
    } else {
      $('pickHint').textContent = '共 ' + installedList.length + ' 个应用';
    }

    queueVisibleIcons();
  }

  function iconMime(b64) {
    var bin;
    try { bin = atob(b64.slice(0, 32)); } catch (e) { return ''; }
    var c = function (i) { return bin.charCodeAt(i) || 0; };
    if (c(0) === 0x89 && c(1) === 0x50) return 'image/png';
    if (c(0) === 0xFF && c(1) === 0xD8) return 'image/jpeg';
    if (c(0) === 0x52 && c(1) === 0x49 && c(2) === 0x46 && c(3) === 0x46 && c(8) === 0x57) return 'image/webp';
    return '';
  }

  // 已配置应用的原生图标取不到时，单独问守护进程要这一张
  function retryEntryIconBinary(pkg) {
    var isEntry = false;
    entries.forEach(function (e) { if (e.pkg === pkg) isEntry = true; });
    if (!isEntry || entryIconTried[pkg] || !hasBinary()) return;
    entryIconTried[pkg] = 1;
    var r = sh("'" + MOD + "/App_screen_off' --icon='" + pkg + "' 2>/dev/null");
    var b = (r.stdout || '').replace(/\s+/g, '');
    var mime = b ? iconMime(b) : '';
    if (!mime) return;
    iconCache[pkg] = 'data:' + mime + ';base64,' + b;
    delete iconDead[pkg];
    paintIcon(pkg, iconCache[pkg]);
  }

  function applyIconImg(img, pkg, src) {
    if (src.indexOf('ksu://') === 0) {
      img.onload = function () { nativeIconOkCount++; };
      img.onerror = function () {
        img.onerror = null;
        nativeIconFail++;
        // 只有「一次都没成功」且失败足够多，才判定管理器不支持这个协议；
        // 几百个应用里个别取不到图标很常见，不能因此把所有图标都关掉
        if (nativeIconOkCount === 0 && nativeIconFail >= 6) {
          nativeIconOk = -1;
          for (var k in iconSrc) {
            if (iconSrc[k].indexOf('ksu://') === 0) delete iconSrc[k];
          }
          iconDead = {};
          if (!scanTried) startNameScan();
          // 协议不可用：已配置的应用立刻改用 --icon 现场取图，不等整机扫描
          setTimeout(function () { prefetchEntryIcons(); }, 0);
        }
        delete iconSrc[pkg];
        if (iconCache[pkg]) {
          iconSrc[pkg] = iconCache[pkg];
          img.src = iconCache[pkg];
          img.style.display = 'block';
        } else if (iconIndex[pkg]) {
          queueIcons([pkg]);
        } else {
          iconDead[pkg] = 1;
          img.style.display = 'none';
          setTimeout(function () { retryEntryIconBinary(pkg); }, 0);
        }
      };
    }
    img.src = src;
    img.style.display = 'block';
  }

  // 图标来源统一记在 iconSrc[pkg]，重绘时直接复用，不会因为重新渲染而丢图标。
  // 选择器里几百行不一次性发几百个 ksu:// 请求，交给 queueVisibleIcons 只画可见行。
  function makeAvatar(pkg, name, eager) {
    var av = document.createElement('div');
    av.className = 'avatar' + (name ? '' : ' unknown');
    var sp = document.createElement('span');
    sp.textContent = name ? name.charAt(0) : '?';
    av.appendChild(sp);

    var img = document.createElement('img');
    img.setAttribute('data-icon-pkg', pkg);
    img.alt = '';
    av.appendChild(img);

    if (iconDead[pkg]) return av;

    if (iconSrc[pkg]) {
      applyIconImg(img, pkg, iconSrc[pkg]);
    } else if (eager) {
      if (nativeIconOk >= 0) {
        iconSrc[pkg] = 'ksu://icon/' + pkg;
        applyIconImg(img, pkg, iconSrc[pkg]);
      } else if (iconCache[pkg]) {
        iconSrc[pkg] = iconCache[pkg];
        applyIconImg(img, pkg, iconSrc[pkg]);
      } else {
        queueIcons([pkg]);
      }
    }
    return av;
  }

  function paintIcon(pkg, src) {
    iconSrc[pkg] = src;
    var nodes = document.querySelectorAll('img[data-icon-pkg="' + pkg + '"]');
    for (var i = 0; i < nodes.length; i++) applyIconImg(nodes[i], pkg, src);
  }

  function queueIcons(pkgs) {
    var added = false;
    pkgs.forEach(function (p) {
      if (iconSrc[p] || iconDead[p] || iconAsked[p] || iconQueue.indexOf(p) >= 0) return;
      if (nativeIconOk < 0 && !iconIndex[p] && !iconCache[p]) return;
      iconQueue.push(p);
      added = true;
    });
    if (added && !iconTimer) iconTimer = setTimeout(pumpIcons, 20);
  }

  function pumpIcons() {
    iconTimer = null;
    if (!iconQueue.length || !hasKsu()) return;
    var pkg = iconQueue.shift();
    if (!iconSrc[pkg] && !iconDead[pkg]) {
      if (nativeIconOk >= 0) {
        paintIcon(pkg, 'ksu://icon/' + pkg);
      } else if (iconCache[pkg]) {
        paintIcon(pkg, iconCache[pkg]);
      } else if (iconIndex[pkg] && !iconAsked[pkg]) {
        iconAsked[pkg] = 1;
        var r = sh("base64 '" + ICON_DIR + "/" + iconIndex[pkg] + "' 2>/dev/null");
        var b = (r.stdout || '').replace(/\s+/g, '');
        var mime = b ? iconMime(b) : '';
        if (mime) {
          iconCache[pkg] = 'data:' + mime + ';base64,' + b;
          paintIcon(pkg, iconCache[pkg]);
        }
      }
    }
    if (iconQueue.length) iconTimer = setTimeout(pumpIcons, 20);
  }

  function queueVisibleIcons() {
    var box = $('pickList');
    if (!box || !box.children || !box.getBoundingClientRect) return;
    var br = box.getBoundingClientRect();
    var pkgs = [];
    for (var i = 0; i < box.children.length; i++) {
      var el = box.children[i];
      if (!el.getAttribute || !el.getBoundingClientRect) continue;
      var r = el.getBoundingClientRect();
      // 行是按顺序排的，滚过可视区尽头就可以停，不必把几百行都算一遍
      if (r.top > br.bottom + 160) break;
      if (r.bottom < br.top - 80) continue;
      var pkg = el.getAttribute('data-pkg');
      if (!pkg || iconSrc[pkg] || iconDead[pkg]) continue;
      if (pkgs.indexOf(pkg) < 0) pkgs.push(pkg);
    }
    queueIcons(pkgs);
  }

  function loadIconIndex() {
    if (iconIndexLoaded || !hasKsu()) return;
    var r = sh("cat '" + ICON_INDEX + "' 2>/dev/null");
    var text = (r.stdout || '');
    if (!text.trim()) return;
    text.split('\n').forEach(function (line) {
      var t = line.replace(/\r$/, '').trim();
      if (!t) return;
      var i = t.indexOf('\t');
      if (i <= 0) return;
      var pkg = t.slice(0, i).trim();
      var fn = t.slice(i + 1).trim();
      if (validPkgName(pkg) && fn) iconIndex[pkg] = fn;
    });
    iconIndexLoaded = true;
  }

  function applyNames(text) {
    var changed = false;
    (text || '').split('\n').forEach(function (line) {
      var t = line.replace(/\r$/, '').trim();
      if (!t || t.charAt(0) === '#') return;
      var i = t.indexOf('\t');
      if (i <= 0) return;
      var pkg = t.slice(0, i).trim();
      var name = t.slice(i + 1).trim();
      if (!validPkgName(pkg) || !name) return;
      if (nameMap[pkg] !== name) { nameMap[pkg] = name; changed = true; }
    });
    if (changed && installedList) {
      installedList.forEach(function (it) {
        if (!it.name && nameMap[it.pkg]) it.name = nameMap[it.pkg];
      });
      if (pickerOpen) renderPicker();
    }
    return changed;
  }

  // 守护进程 --labels 生成 pkg<TAB>名称，缓存在模块目录，下次直接读
  function loadNameCache() {
    if (!hasKsu()) return false;
    var r = sh("if [ -f '" + NAME_CACHE + "' ]; then cat '" + NAME_CACHE + "'; echo __EXISTS__; fi");
    var out = (r.stdout || '');
    if (out.indexOf('__EXISTS__') < 0) return false;
    applyNames(out.replace(/__EXISTS__/g, ''));
    return true;
  }

  function startNameScan() {
    if (nameScanning || !hasKsu()) return;
    if (!hasBinary()) {
      $('pickHint').textContent = '模块文件不完整（缺 App_screen_off），识别不了名称和图标';
      return;
    }
    nameScanning = true;
    scanTried = true;
    sh("touch '" + MOD + "/.scan'");
    if (pickerOpen) $('pickHint').textContent = '正在识别应用名称…（首次约 10 秒）';

    var tries = 0;
    var sawPart = false;
    var spawned = false;
    var timer = setInterval(function () {
      tries++;
      var r = sh("cat '" + NAME_CACHE + ".part' 2>/dev/null; if [ -f '" + NAME_CACHE + "' ] && [ -f '" + ICON_INDEX + "' ]; then echo __DONE__; fi");
      var out = (r.stdout || '');
      var done = out.indexOf('__DONE__') >= 0;
      out = out.replace(/__DONE__/g, '');
      if (out) sawPart = true;
      // 守护进程没在跑时，自己拉起一个扫描；已有 .scan.lock 就不再起第二个
      if (!sawPart && !spawned && tries === 8) {
        var lk = sh("test -f '" + MOD + "/.scan.lock' && echo 1");
        if ((lk.stdout || '').trim() !== '1') {
          spawned = true;
          sh("rm -f '" + MOD + "/.scan'");
          sh("(nohup '" + MOD + "/App_screen_off' --scan='" + MOD + "' >/dev/null 2>&1 &)");
        }
      }
      applyNames(out);
      if (done) {
        clearInterval(timer);
        nameScanning = false;
        iconIndexLoaded = false;
        iconAsked = {};
        iconDead = {};
        loadIconIndex();
        if (pickerOpen) renderPicker();
        return;
      }
      if (tries >= 80) {
        clearInterval(timer);
        nameScanning = false;
        sh("rm -f '" + MOD + "/.scan'");
        if (pickerOpen) $('pickHint').textContent = '识别超时，已停止后台扫描，可点「重新读取」重试';
      }
    }, 1500);
  }

  function fillPicker(force) {
    $('pickHint').textContent = '正在读取已安装应用…';
    setPickCount(0);
    $('pickList').innerHTML = '';
    setTimeout(function () {
      var list = loadInstalled(force);
      if (!list.length) {
        $('pickHint').textContent = '这台机器读不到已安装应用列表，直接在上面输入包名即可';
        return;
      }
      renderPicker();
      refreshEntryNames();
    }, 40);
  }


  // 进页面时就把「已配置应用」的名称和图标补齐，不依赖打开应用列表
  function primeEntryNames() {
    if (!entries.length || !hasKsu()) return;
    var pkgs = [];
    entries.forEach(function (e) { if (!e.name) pkgs.push(e.pkg); });
    if (!pkgs.length) return;

    var labels = nativeLabels(pkgs);
    var changed = false;
    entries.forEach(function (e) {
      if (e.name) return;
      var nm = (labels && labels[e.pkg]) || PRESETS[e.pkg] || nameMap[e.pkg];
      if (nm) { e.name = nm; changed = true; }
    });
    if (changed) render();
    if (labels || !hasBinary()) return;

    // 管理器没有原生接口时，逐个问守护进程 --label
    var i = 0;
    (function step() {
      if (i >= pkgs.length) return;
      var pkg = pkgs[i++];
      if (entryNameTried[pkg]) { setTimeout(step, 0); return; }
      entryNameTried[pkg] = 1;
      var r = sh("'" + MOD + "/App_screen_off' --label='" + pkg + "' 2>/dev/null");
      var nm = (r.stdout || '').split('\n')[0].trim();
      if (nm && nm.length < 80) {
        var hit = false;
        entries.forEach(function (e) { if (e.pkg === pkg && !e.name) { e.name = nm; hit = true; } });
        if (hit) render();
      }
      setTimeout(step, 16);
    })();
  }

  // 优先给已配置的应用拿图标：原生协议 → 缓存文件 → 现场解包（--icon），不等整机扫描
  function prefetchEntryIcons() {
    if (!entries.length || !hasKsu()) return;

    var todo = [];
    entries.forEach(function (e) {
      var pkg = e.pkg;
      if (iconSrc[pkg] || iconDead[pkg]) return;
      if (iconCache[pkg]) { paintIcon(pkg, iconCache[pkg]); return; }
      if (nativeIconOk >= 0) { paintIcon(pkg, 'ksu://icon/' + pkg); return; }
      if (iconIndex[pkg]) { queueIcons([pkg]); return; }
      if (entryIconTried[pkg] || !hasBinary()) return;
      todo.push(pkg);
    });
    if (!todo.length) return;

    var i = 0;
    (function step() {
      if (i >= todo.length) return;
      var pkg = todo[i++];
      entryIconTried[pkg] = 1;
      var r = sh("'" + MOD + "/App_screen_off' --icon='" + pkg + "' 2>/dev/null");
      var b = (r.stdout || '').replace(/\s+/g, '');
      var mime = b ? iconMime(b) : '';
      if (mime) {
        iconCache[pkg] = 'data:' + mime + ';base64,' + b;
        paintIcon(pkg, iconCache[pkg]);
      }
      setTimeout(step, 16);
    })();
  }

  function refreshEntryNames() {
    var changed = false;
    entries.forEach(function (e) {
      if (!e.name && pkgName[e.pkg]) {
        e.name = pkgName[e.pkg];
        changed = true;
      }
    });
    if (changed) {
      dirty = true;
      render();
    }
  }

  function togglePicker() {
    pickerOpen = !pickerOpen;
    $('picker').hidden = !pickerOpen;
    $('pickBtn').textContent = pickerOpen ? '收起列表' : '选择应用';
    if (!pickerOpen) return;

    if (!hasKsu()) {
      $('pickHint').textContent = '当前环境没有执行权限，读不到应用列表';
      return;
    }
    fillPicker(false);
    var hasNames = loadNameCache();
    loadIconIndex();
    if (!nativePm() && (!hasNames || !iconIndexLoaded) && !scanTried) startNameScan();
    queueVisibleIcons();
  }

  function reloadPicker() {
    pickLetter = '';
    installedList = null;
    nameMap = {};
    iconIndex = {};
    iconCache = {};
    iconSrc = {};
    iconAsked = {};
    iconDead = {};
    iconQueue = [];
    iconIndexLoaded = false;
    if (hasKsu()) sh("rm -rf '" + ICON_DIR + "' '" + NAME_CACHE + "'");
    fillPicker(true);
    startNameScan();
  }

  function save() {
    if (!hasKsu()) return;
    if (!entries.length) {
      toast('先在上面输入包名，添加至少一个应用');
      return;
    }
    entries.forEach(function (e) { e.limit = parseLimitMinutes(e.limit) + 'm'; });
    var content = serialize(entries);

    sh("mkdir -p '" + MOD + "'");
    sh("[ -f '" + CONFIG + "' ] && cp -f '" + CONFIG + "' '" + BACKUP + "'");

    var w = sh("printf '%s' '" + b64(content) + "' | base64 -d > '" + CONFIG + ".tmp' && chmod 0644 '" + CONFIG + ".tmp' && mv -f '" + CONFIG + ".tmp' '" + CONFIG + "'");
    if (w.errno !== 0) {
      w = sh("printf '%b' '" + toOctalEscaped(content) + "' > '" + CONFIG + ".tmp' && chmod 0644 '" + CONFIG + ".tmp' && mv -f '" + CONFIG + ".tmp' '" + CONFIG + "'");
    }
    if (w.errno !== 0) {
      var why = (w.stdout || '').trim() || '未知错误';
      notice('保存失败（退出码 ' + w.errno + '）：' + why);
      toast('保存失败，看上方提示');
      return;
    }

    var chk = sh("cat '" + CONFIG + "'");
    if ((chk.stdout || '') !== content) {
      notice('保存后校验不一致：应写入 ' + new TextEncoder().encode(content).length + ' 字节，读回 ' + new TextEncoder().encode(chk.stdout || '').length + ' 字节。配置可能没写进去，请把这条信息反馈给作者。');
      toast('保存校验失败，看上方提示');
      return;
    }

    dirty = false;
    srcLabel = '模块配置';
    notice('');
    render();
    toast('已保存，10 秒内生效');
    setTimeout(refreshStatus, 800);
  }

  function restart() {
    if (!hasKsu()) return;
    if (!hasBinary()) { toast('缺少 App_screen_off，先重新刷入模块'); return; }
    sh("kill $(cat '" + MOD + "/.supervisor.pid' 2>/dev/null | awk '{print $2}') 2>/dev/null; killall -15 App_screen_off 2>/dev/null");
    sh("nohup sh '" + MOD + "/service.sh' >/dev/null 2>&1 &");
    toast('已重启，3 秒后刷新状态');
    setTimeout(refreshStatus, 2600);
  }

  function stop() {
    if (!hasKsu()) return;
    sh("kill $(cat '" + MOD + "/.supervisor.pid' 2>/dev/null | awk '{print $2}') 2>/dev/null; killall -15 App_screen_off 2>/dev/null; "
      + "i=4; while [ -n \"$(pidof App_screen_off)\" ] && [ $i -gt 0 ]; do sleep 1; i=$((i-1)); done; "
      + "killall -9 App_screen_off 2>/dev/null; rm -f '" + MOD + "/.daemon.lock' '" + MOD + "/.scan.lock' '" + MOD + "/.scan'");
    toast('已停止（重新启用模块或重启可恢复）');
    setTimeout(refreshStatus, 1200);
  }

  $('saveBtn').onclick = save;
  $('importBtn').onclick = importDownload;
  $('exportCfgBtn').onclick = exportBackup;
  $('refreshBtn').onclick = function () { refreshStatus(); toast('已刷新'); };
  $('logToggle').onclick = function () { setLogCollapsed(!$('logBox').classList.contains('collapsed')); };
  $('testOffBtn').onclick = testOff;
  $('restartBtn').onclick = restart;
  $('stopBtn').onclick = stop;
  $('diagBtn').onclick = runDiag;
  $('pkgAdd').onclick = manualAdd;
  $('pickBtn').onclick = togglePicker;
  $('pickReload').onclick = reloadPicker;
  $('pickSearch').oninput = renderPicker;
  var iconScrollTick = false;
  $('pickList').onscroll = function () {
    if (iconScrollTick) return;
    iconScrollTick = true;
    setTimeout(function () { iconScrollTick = false; queueVisibleIcons(); }, 80);
  };
  $('pkgInput').onkeydown = function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); manualAdd(); }
  };


  window.addEventListener('beforeunload', function (ev) {
    if (dirty) { ev.preventDefault(); ev.returnValue = ''; }
  });

  load();
})();
</script>
</body>
</html>
